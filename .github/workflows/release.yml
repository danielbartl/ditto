name: Release

# Push a tag like v0.2.0 to release: the version comes from the tag, master stays on -SNAPSHOT.
on:
  push:
    tags: ['v*']

jobs:
  github:
    name: GitHub Packages and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      # writes a settings.xml with server "github" authenticated by GITHUB_TOKEN
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github

      - name: Set version from tag
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build, test and deploy ditto-core to GitHub Packages
        run: ./mvnw -B -ntp -Prelease -Dgpg.skip deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with the CLI jar
        run: gh release create "$GITHUB_REF_NAME" ditto-cli/target/ditto-cli.jar --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Needs the secrets MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Sonatype Central Portal user token) and
  # GPG_PRIVATE_KEY / GPG_PASSPHRASE. The release is published right away; with the repository variable
  # CENTRAL_AUTO_PUBLISH set to 'false', it is uploaded and validated but waits for "Publish" in the Central Portal.
  central:
    name: Maven Central
    needs: github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set version from tag
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Deploy to Maven Central
        run: |
          if [ "${{ vars.CENTRAL_AUTO_PUBLISH }}" = "false" ]; then
            publish="-Dcentral.autoPublish=false -Dcentral.waitUntil=validated"
          fi
          ./mvnw -B -ntp -Prelease,central -DskipTests $publish deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # maven-gpg-plugin 3.2+ reads the passphrase from this variable (and signs with loopback pinentry)
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
