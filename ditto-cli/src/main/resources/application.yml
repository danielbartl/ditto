# Short command-line aliases (--uri, --db, --persist, ...) mapped onto the real properties.
# The full property names (--spring.mongodb.uri, --ditto.*) work as well and take precedence.
spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  mongodb:
    uri: ${uri:mongodb://localhost:27017}
    database: ${db:test}

ditto:
  persistence:
    enabled: ${persist:false}

logging:
  level:
    root: WARN
    dev.jbaby.ditto: INFO
